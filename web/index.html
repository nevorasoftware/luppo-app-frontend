<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Luppo — Plataforma Inteligente de Gestión Comercial. Organiza tus clientes, da seguimiento y mantén tus oportunidades en movimiento.">
  <meta name="theme-color" content="#112A46">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Luppo">
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23112A46'/%3E%3Cpath d='M22 62 L42 38 L62 52 L82 26' fill='none' stroke='%2319A7A0' stroke-width='10' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"/>

  <title>Luppo — Plataforma Inteligente de Gestión Comercial</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #F5F7FA;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #0B1B2D;
      color: #FFFFFF;
      overflow: hidden;
      padding: 20px;
      box-sizing: border-box;
    }
    .splash-video-wrapper {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      max-width: 420px;
      width: 90%;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      border: 1px solid #183957;
      background: #112A46;
    }
    .splash-video {
      width: 100%;
      height: auto;
      max-height: 48vh;
      object-fit: contain;
      display: block;
    }
    .loading-pulse-dot {
      width: 8px;
      height: 8px;
      background-color: #19A7A0;
      border-radius: 50%;
      box-shadow: 0 0 12px #19A7A0;
      animation: pulse-dot 1.4s infinite ease-in-out;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.3); }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading-container">
    <div class="splash-video-wrapper">
      <video
        id="splash-video"
        autoplay
        muted
        playsinline
        loop
        class="splash-video"
      >
        <source src="https://lottie.host/82f0ec9e-ecd8-43dc-a709-3bb449c92eb9/x045anGmzj.mp4" type="video/mp4">
        <source src="loading.mp4" type="video/mp4">
      </video>
    </div>
    <div style="margin-top: 24px; display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <h2 style="font-weight: 900; letter-spacing: 4px; margin: 0; font-size: 24px; color: #FFFFFF;">LUPPO</h2>
      <div style="display: flex; align-items: center; gap: 8px;">
        <span class="loading-pulse-dot"></span>
        <span style="color: #19A7A0; font-size: 12px; letter-spacing: 1.5px; font-weight: 600;">CARGANDO APLICACIÓN...</span>
      </div>
    </div>
  </div>
  <script>
    // Transición suave cuando Flutter dibuje el primer fotograma
    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('loading');
      if (loader) {
        loader.style.transition = 'opacity 0.5s ease-out';
        loader.style.opacity = '0';
        setTimeout(() => {
          if (loader.parentNode) loader.parentNode.removeChild(loader);
        }, 500);
      }
    });

    // Limpiar cualquier Service Worker y caché anterior para asegurar la versión más reciente
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) {
          caches.delete(name);
        }
      });
    }
  </script>
  <script src="flutter_bootstrap.js?v=2" async></script>
</body>
</html>
