<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Luppo — Plataforma Inteligente de Gestión Comercial. Organiza tus clientes, da seguimiento y mantén tus oportunidades en movimiento.">
  <meta name="theme-color" content="#112A46">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Luppo">
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23112A46'/%3E%3Cpath d='M22 62 L42 38 L62 52 L82 26' fill='none' stroke='%2319A7A0' stroke-width='10' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"/>

  <title>Luppo — Plataforma Inteligente de Gestión Comercial</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #0B1B2D;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #0B1B2D;
      color: #FFFFFF;
      overflow: hidden;
      padding: 20px;
      box-sizing: border-box;
    }
    .luppo-iris {
      width: 76px;
      height: 76px;
      background: #112A46;
      border: 2px solid #183957;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .luppo-iris-white {
      width: 48px;
      height: 48px;
      background: #FFFFFF;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .luppo-iris-teal {
      width: 26px;
      height: 26px;
      background: #19A7A0;
      border-radius: 50%;
    }
    .luppo-brand-text {
      display: flex;
      align-items: center;
      margin-top: 18px;
      font-weight: 900;
      font-size: 26px;
      letter-spacing: 2.5px;
      color: #FFFFFF;
    }
    .luppo-o-dot {
      width: 22px;
      height: 22px;
      border: 4px solid #FFFFFF;
      border-radius: 50%;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
      margin-left: 2px;
    }
    .luppo-o-dot span {
      width: 7px;
      height: 7px;
      background: #19A7A0;
      border-radius: 50%;
    }
    .loading-subtext {
      color: #94A3B8;
      font-size: 11px;
      letter-spacing: 1.5px;
      font-weight: 600;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div id="loading" class="loading-container">
    <div class="luppo-iris">
      <div class="luppo-iris-white">
        <div class="luppo-iris-teal"></div>
      </div>
    </div>
    <div class="luppo-brand-text">
      <span>LUPP</span>
      <div class="luppo-o-dot"><span></span></div>
    </div>
    <div class="loading-subtext">GESTIÓN COMERCIAL</div>
  </div>
  <script>
    // Transición suave cuando Flutter dibuje el primer fotograma
    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('loading');
      if (loader) {
        loader.style.transition = 'opacity 0.3s ease-out';
        loader.style.opacity = '0';
        setTimeout(() => {
          if (loader.parentNode) loader.parentNode.removeChild(loader);
        }, 300);
      }
    });

    // Limpiar cualquier Service Worker y caché anterior para asegurar la versión más reciente
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) {
          caches.delete(name);
        }
      });
    }
  </script>
  <script src="flutter_bootstrap.js?v=2" async></script>
</body>
</html>
